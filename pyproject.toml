[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e0-framework"
version = "0.6.0"
description = "E₀ Controller — Ontodynamic Action Selection via Amplitude Interference"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "numpy",
]

[project.optional-dependencies]
llm = ["openai"]
full = ["openai", "pyyaml", "duckdb"]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["e0_controller*"]

[tool.pytest.ini_options]
filterwarnings = [
    # Advisory hint for goal+simple geometry — intentional in tests
    "ignore:Goal .* is set but hybrid_geometry='simple':UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
