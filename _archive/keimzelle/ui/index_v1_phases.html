<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E₀ Keimzelle</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-input: #0d1117;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --phase-open: #58a6ff;
      --phase-friction: #f0883e;
      --phase-condense: #3fb950;
      --phase-derive: #bc8cff;
      --human: #f0883e;
      --theta: #58a6ff;
      --kappa: #bc8cff;
      --a3: #3fb950;
      --system: #8b949e;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 .e0 { color: var(--accent); }
    header .network-name { color: var(--text-muted); font-weight: 400; }
    header nav { display: flex; gap: 8px; }
    header nav button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
    }
    header nav button:hover { border-color: var(--accent); color: var(--accent); }
    header nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Views ── */
    .view { display: none; padding: 24px; max-width: 1200px; margin: 0 auto; }
    .view.active { display: block; }

    /* ── Setup View ── */
    #setup-view {
      flex-direction: column; align-items: center;
      justify-content: center; min-height: 80vh; text-align: center;
    }
    #setup-view.active {
      display: flex;
    }
    #setup-view h2 { font-size: 28px; margin-bottom: 8px; }
    #setup-view p { color: var(--text-muted); margin-bottom: 32px; max-width: 500px; }
    .setup-form { width: 100%; max-width: 400px; }
    .setup-form label { display: block; text-align: left; margin-bottom: 4px; color: var(--text-muted); font-size: 13px; }
    .setup-form input {
      width: 100%; padding: 10px 14px; margin-bottom: 16px;
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius); font-size: 14px;
    }
    .setup-form input:focus { outline: none; border-color: var(--accent); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text); cursor: pointer; font-size: 13px;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Dashboard ── */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .session-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .session-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }
    .session-card h3 { font-size: 16px; margin-bottom: 4px; }
    .session-card .topic { color: var(--text-muted); font-size: 13px; margin-bottom: 12px; }
    .session-card .meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px;
    }
    .phase-badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: 11px; font-weight: 600; color: #fff;
    }
    .phase-open { background: var(--phase-open); }
    .phase-friction { background: var(--phase-friction); }
    .phase-condense { background: var(--phase-condense); }
    .phase-derive { background: var(--phase-derive); }

    .new-session-card {
      background: transparent;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 120px;
      transition: border-color 0.15s;
    }
    .new-session-card:hover { border-color: var(--accent); }
    .new-session-card span { color: var(--text-muted); font-size: 14px; }
    .new-session-card .plus { font-size: 32px; color: var(--text-muted); margin-bottom: 4px; }

    /* ── Session Detail ── */
    .session-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 24px;
    }
    .session-header h2 { font-size: 22px; }
    .session-header .topic { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

    /* ── Spur (Trail) ── */
    .spur { margin: 16px 0; }
    .delta-block {
      position: relative;
      padding-left: 28px;
      margin-bottom: 24px;
    }
    .delta-block::before {
      content: '';
      position: absolute; left: 8px; top: 28px; bottom: 0;
      width: 2px; background: var(--border);
    }
    .delta-block:last-child::before { display: none; }
    .delta-marker {
      position: absolute; left: 0; top: 4px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--bg);
    }
    .delta-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .delta-text { font-size: 15px; font-weight: 500; margin-bottom: 12px; }
    .delta-text .label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Runden-Anzeige ── */
    .rounds-list { margin-top: 12px; }
    .round-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; font-size: 13px; cursor: pointer;
      color: var(--text-muted);
      transition: color 0.1s;
    }
    .round-row:hover { color: var(--text); }
    .round-row.active { color: var(--text); font-weight: 500; }
    .round-row .phase-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .round-row .participants {
      display: flex; gap: 4px; margin-left: auto;
    }
    .participant-dot {
      width: 16px; height: 16px; border-radius: 50%;
      font-size: 9px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .participant-dot.human { background: var(--human); }
    .participant-dot.theta { background: var(--theta); }
    .participant-dot.kappa { background: var(--kappa); }
    .participant-dot.system { background: var(--system); }

    /* ── Detail-Panel ── */
    .detail-panel {
      margin-top: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .detail-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .detail-header h3 { font-size: 14px; }

    .notes-container { padding: 16px; }

    .note {
      margin-bottom: 16px;
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      position: relative;
    }
    .note.human { border-left: 3px solid var(--human); }
    .note.llm.theta { border-left: 3px solid var(--theta); }
    .note.llm.kappa { border-left: 3px solid var(--kappa); }
    .note.llm.a3 { border-left: 3px solid var(--a3); }
    .note.system { border-left: 3px solid var(--system); }

    /* Koordinations-Notes: visuell abgehoben */
    .note.coordination-note {
      border-left: 3px solid var(--a3);
      background: #1a2332;
      position: relative;
    }
    .note.coordination-note::before {
      content: '⟐';
      position: absolute;
      top: 8px;
      right: 12px;
      color: var(--a3);
      font-size: 14px;
      opacity: 0.6;
    }

    .note-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px; font-size: 12px;
    }
    .note-author {
      font-weight: 600; font-size: 13px;
    }
    .note-author.human { color: var(--human); }
    .note-author.theta { color: var(--theta); }
    .note-author.kappa { color: var(--kappa); }
    .note-author.a3 { color: var(--a3); }

    .note-meta { color: var(--text-muted); }
    .note-content {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* ── Input Area ── */
    .input-area {
      border-top: 1px solid var(--border);
      padding: 16px;
      background: var(--bg);
    }
    .input-area label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-area textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical;
    }
    .input-area textarea:focus { outline: none; border-color: var(--accent); }
    .input-actions {
      display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end;
    }

    /* ── New Session Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      display: none;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 90%; max-width: 460px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .modal h3 { margin-bottom: 16px; }
    .modal label {
      display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px;
    }
    .modal input, .modal textarea {
      width: 100%; padding: 10px 14px; margin-bottom: 14px;
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius); font-size: 14px;
      font-family: inherit;
    }
    .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ── Loading ── */
    .loading {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-muted); font-size: 13px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Session Layout ── */
    .session-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .session-layout { grid-template-columns: 1fr; }
    }

    .sidebar { position: sticky; top: 24px; max-height: calc(100vh - 100px); overflow-y: auto; }

    /* ── Phase Progress ── */
    .phase-progress {
      display: flex; gap: 4px; margin: 12px 0;
    }
    .phase-step {
      flex: 1; height: 4px; border-radius: 2px;
      background: var(--border);
    }
    .phase-step.done { background: var(--phase-condense); }
    .phase-step.current { background: var(--accent); }

    /* ── Graph View ── */
    .graph-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 16px;
      min-height: 300px;
      position: relative;
    }
    .graph-container canvas {
      width: 100%; height: 300px;
    }
  </style>
</head>
<body>

  <!-- ═══ Header ═══ -->
  <header>
    <h1>
      <span class="e0">E₀</span> Keimzelle
      <span class="network-name" id="network-name"></span>
    </h1>
    <nav id="main-nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="session" style="display:none">Session</button>
    </nav>
  </header>

  <!-- ═══ Setup View ═══ -->
  <div class="view" id="setup-view">
    <h2>Willkommen bei <span style="color:var(--accent)">E₀</span></h2>
    <p>
      E₀ ist ein System für Ko-Kognition: Menschen und KI-Systeme denken
      gemeinsam über Probleme nach, die keiner allein lösen kann.
    </p>
    <div class="setup-form">
      <label for="setup-name">Wie willst du dein Netzwerk nennen?</label>
      <input type="text" id="setup-name" placeholder="z.B. E₀-Bochum" />
      <button class="btn primary" onclick="doSetup()" style="width:100%">Netzwerk starten</button>
    </div>
  </div>

  <!-- ═══ Dashboard View ═══ -->
  <div class="view" id="dashboard-view">
    <h2>Sessions</h2>
    <div class="dashboard-grid" id="sessions-grid">
      <!-- Dynamisch befüllt -->
    </div>
  </div>

  <!-- ═══ Session View ═══ -->
  <div class="view" id="session-view">
    <button class="btn" onclick="showDashboard()" style="margin-bottom:16px">← Zurück</button>

    <div class="session-header">
      <div>
        <h2 id="session-title"></h2>
        <div class="topic" id="session-topic"></div>
      </div>
      <div style="text-align:right">
        <span class="phase-badge" id="session-phase-badge"></span>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px" id="session-round-info"></div>
      </div>
    </div>

    <div class="phase-progress" id="phase-progress"></div>

    <div class="session-layout">
      <!-- Sidebar: Delta-Spur -->
      <div class="sidebar">
        <h3 style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px">
          Spur der Kognition
        </h3>
        <div class="spur" id="spur-container"></div>
        <button class="btn" onclick="showNewDeltaModal()" style="width:100%;margin-top:8px">
          + Neues Delta
        </button>
      </div>

      <!-- Main: Notes + Input -->
      <div>
        <div class="detail-panel" id="detail-panel">
          <div class="detail-header">
            <h3 id="detail-title">Wähle ein Delta</h3>
          </div>
          <div class="notes-container" id="notes-container">
            <p style="color:var(--text-muted);font-size:14px;padding:20px 0;text-align:center">
              Klicke links auf ein Delta, um die Beiträge zu sehen.
            </p>
          </div>
          <div class="input-area" id="input-area" style="display:none">
            <label id="input-label">Deine Differenz</label>
            <textarea id="human-input" placeholder="Was fällt dir auf? Was fehlt? Was stimmt nicht?"></textarea>
            <div class="input-actions">
              <button class="btn" onclick="submitResponse()">Antworten</button>
              <button class="btn" onclick="deriveDelta()">Neues Delta ableiten</button>
              <button class="btn primary" onclick="runNextPhase()">
                <span id="run-btn-text">Nächste Phase starten</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ New Session Modal ═══ -->
  <div class="modal-overlay" id="new-session-modal">
    <div class="modal">
      <h3>Neue Session</h3>
      <label for="modal-session-name">Name der Session</label>
      <input type="text" id="modal-session-name" placeholder="z.B. Verkehr in Bochum" />
      <label for="modal-session-topic">Thema / Frage / Spannung</label>
      <textarea id="modal-session-topic" rows="3" placeholder="Was beschäftigt dich? Je konkreter, desto besser."></textarea>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('new-session-modal')">Abbrechen</button>
        <button class="btn primary" onclick="createSession()">Session starten</button>
      </div>
    </div>
  </div>

  <!-- ═══ New Delta Modal ═══ -->
  <div class="modal-overlay" id="new-delta-modal">
    <div class="modal">
      <h3>Neues Delta setzen</h3>
      <label for="modal-delta-content">Neue Frage, Spannung oder Differenz</label>
      <textarea id="modal-delta-content" rows="3" placeholder="Was ist die nächste Frage?"></textarea>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('new-delta-modal')">Abbrechen</button>
        <button class="btn primary" onclick="createDelta()">Delta setzen</button>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════
    //  State
    // ═══════════════════════════════════════════
    let currentSession = null;
    let currentDelta = null;
    let sessionData = null;

    const PHASE_COLORS = {
      open: 'var(--phase-open)',
      friction: 'var(--phase-friction)',
      condense: 'var(--phase-condense)',
      derive: 'var(--phase-derive)',
    };
    const PHASES = ['open', 'friction', 'condense', 'derive'];
    const PHASE_LABELS = {
      open: 'Öffnen',
      friction: 'Reiben',
      condense: 'Verdichten',
      derive: 'Ableiten',
    };
    const INPUT_PROMPTS = {
      open: 'Was davon trifft dich? Was fehlt? Was stimmt nicht?',
      friction: 'Wo haben sie recht? Wo liegen sie falsch?',
      condense: 'Passt diese Verdichtung? Was fehlt?',
      derive: 'Welche nächsten Schritte siehst du?',
    };

    // ═══════════════════════════════════════════
    //  API
    // ═══════════════════════════════════════════
    async function api(method, path, body = null) {
      const url = '/api' + path;
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      try {
        const resp = await fetch(url, opts);
        if (!resp.ok) {
          const text = await resp.text();
          console.error('API error:', resp.status, text);
          throw new Error('API ' + resp.status + ': ' + text);
        }
        return await resp.json();
      } catch (e) {
        console.error('API call failed:', method, path, e);
        throw e;
      }
    }

    // ═══════════════════════════════════════════
    //  Init
    // ═══════════════════════════════════════════
    async function init() {
      try {
        const status = await api('GET', '/status');
        console.log('Status:', status);
        if (!status.initialized) {
          showView('setup');
        } else {
          document.getElementById('network-name').textContent = '— ' + status.network_name;
          showView('dashboard');
          loadSessions();
        }
      } catch (e) {
        console.error('Init failed:', e);
        showView('setup');
      }
    }

    // ═══════════════════════════════════════════
    //  Setup
    // ═══════════════════════════════════════════
    async function doSetup() {
      try {
        const name = document.getElementById('setup-name').value.trim() || 'E₀-Lokal';
        console.log('Setting up network:', name);
        const result = await api('POST', '/setup', { network_name: name });
        console.log('Setup result:', result);
        document.getElementById('network-name').textContent = '— ' + name;
        showView('dashboard');
        await loadSessions();
      } catch (e) {
        console.error('Setup failed:', e);
        alert('Setup fehlgeschlagen: ' + e.message);
      }
    }

    // ═══════════════════════════════════════════
    //  Dashboard
    // ═══════════════════════════════════════════
    async function loadSessions() {
      const sessions = await api('GET', '/sessions');
      const grid = document.getElementById('sessions-grid');

      let html = '';
      for (const s of sessions) {
        html += `
          <div class="session-card" onclick="openSession('${s.id}')">
            <h3>${esc(s.name)}</h3>
            <div class="topic">${esc(s.topic)}</div>
            <div class="meta">
              <span class="phase-badge phase-${s.current_phase}">
                ${esc(s.phase_name)}
              </span>
              <span>Runde ${s.current_round} · ${s.delta_count} Delta${s.delta_count !== 1 ? 's' : ''}</span>
            </div>
          </div>
        `;
      }

      html += `
        <div class="new-session-card" onclick="showModal('new-session-modal')">
          <div class="plus">+</div>
          <span>Neue Session</span>
        </div>
      `;

      grid.innerHTML = html;
    }

    // ═══════════════════════════════════════════
    //  Session
    // ═══════════════════════════════════════════
    async function openSession(id) {
      sessionData = await api('GET', '/session?id=' + id);
      currentSession = sessionData.session;

      document.getElementById('session-title').textContent = currentSession.name;
      document.getElementById('session-topic').textContent = currentSession.topic;

      updatePhaseUI();
      renderSpur();

      // Auto-select latest delta
      if (sessionData.deltas.length > 0) {
        selectDelta(sessionData.deltas[sessionData.deltas.length - 1]);
      }

      showView('session');
      document.querySelector('[data-view="session"]').style.display = '';
    }

    function updatePhaseUI() {
      const badge = document.getElementById('session-phase-badge');
      badge.textContent = currentSession.phase_name;
      badge.className = 'phase-badge phase-' + currentSession.current_phase;

      document.getElementById('session-round-info').textContent =
        'Runde ' + currentSession.current_round;

      // Phase progress bar
      const prog = document.getElementById('phase-progress');
      const currentIdx = PHASES.indexOf(currentSession.current_phase);
      prog.innerHTML = PHASES.map((p, i) => {
        let cls = 'phase-step';
        if (i < currentIdx) cls += ' done';
        if (i === currentIdx) cls += ' current';
        return `<div class="${cls}" title="${PHASE_LABELS[p]}" style="background:${i <= currentIdx ? PHASE_COLORS[p] : ''}"></div>`;
      }).join('');
    }

    function renderSpur() {
      const container = document.getElementById('spur-container');
      let html = '';

      for (const delta of sessionData.deltas) {
        const isActive = currentDelta && currentDelta.id === delta.id;
        const notes = delta.notes || [];

        // Group notes by round+phase
        const rounds = {};
        for (const n of notes) {
          const key = `R${n.round_number}-${n.phase}`;
          if (!rounds[key]) rounds[key] = { round: n.round_number, phase: n.phase, phase_name: n.phase_name, notes: [] };
          rounds[key].notes.push(n);
        }

        html += `
          <div class="delta-block">
            <div class="delta-marker" style="background:${isActive ? 'var(--accent)' : 'var(--border)'}"></div>
            <div class="delta-content ${isActive ? 'active' : ''}"
                 style="border-color:${isActive ? 'var(--accent)' : 'var(--border)'}"
                 onclick="selectDeltaById('${delta.id}')">
              <div class="delta-text">
                <div class="label">Delta</div>
                ${esc(delta.content.length > 80 ? delta.content.substring(0, 80) + '…' : delta.content)}
              </div>
              <div class="rounds-list">
                ${Object.values(rounds).map(r => {
                  const participants = r.notes.map(n => {
                    const cls = getParticipantClass(n);
                    const initial = n.author_name.charAt(0);
                    return `<div class="participant-dot ${cls}" title="${esc(n.author_name)}">${initial}</div>`;
                  }).join('');
                  return `
                    <div class="round-row">
                      <div class="phase-dot" style="background:${PHASE_COLORS[r.phase] || 'var(--border)'}"></div>
                      R${r.round} ${r.phase_name}
                      <div class="participants">${participants}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function selectDeltaById(id) {
      const delta = sessionData.deltas.find(d => d.id === id);
      if (delta) selectDelta(delta);
    }

    function selectDelta(delta) {
      currentDelta = delta;
      renderSpur(); // Update active marker
      renderNotes(delta);
      document.getElementById('input-area').style.display = '';

      // Update input prompt based on phase
      const phase = currentSession.current_phase;
      document.getElementById('input-label').textContent =
        'Deine Differenz — ' + (PHASE_LABELS[phase] || phase);
      document.getElementById('human-input').placeholder =
        INPUT_PROMPTS[phase] || 'Deine Reaktion...';

      const btnText = document.getElementById('run-btn-text');
      const nextPhase = PHASES[PHASES.indexOf(phase) + 1];
      if (nextPhase) {
        btnText.textContent = PHASE_LABELS[phase] + ' → ' + PHASE_LABELS[nextPhase];
      } else {
        btnText.textContent = 'Nächste Runde starten';
      }
    }

    function renderNotes(delta) {
      const container = document.getElementById('notes-container');
      const notes = delta.notes || [];

      document.getElementById('detail-title').textContent =
        'Delta: ' + (delta.content.length > 60 ? delta.content.substring(0, 60) + '…' : delta.content);

      if (notes.length === 0) {
        container.innerHTML = `
          <p style="color:var(--text-muted);font-size:14px;padding:20px 0;text-align:center">
            Noch keine Beiträge. Starte die erste Phase.
          </p>
        `;
        return;
      }

      // Group by round
      const byRound = {};
      for (const n of notes) {
        const key = n.round_number;
        if (!byRound[key]) byRound[key] = [];
        byRound[key].push(n);
      }

      let html = '';
      for (const [round, roundNotes] of Object.entries(byRound)) {
        html += `<div style="margin-bottom:16px">
          <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">
            Runde ${round}
          </div>`;

        for (const n of roundNotes) {
          const cls = getParticipantClass(n);
          const isCoord = n.note_type === 'coordination';
          const authorCls = n.author_name === 'Theta' ? 'theta' :
                           n.author_name === 'Kappa' ? 'kappa' :
                           n.author_name === 'A₃' ? 'a3' :
                           n.author_type === 'human' ? 'human' : '';
          const coordLabel = isCoord ? ' · Koordination' : '';
          const coordClass = isCoord ? ' coordination-note' : '';
          html += `
            <div class="note ${n.author_type} ${cls}${coordClass}">
              <div class="note-header">
                <span class="note-author ${authorCls}">${esc(n.author_name)}${coordLabel}</span>
                <span class="note-meta">
                  <span class="phase-badge phase-${n.phase}" style="font-size:10px">${esc(n.phase_name)}</span>
                </span>
              </div>
              <div class="note-content">${esc(n.content)}</div>
            </div>
          `;
        }
        html += '</div>';
      }

      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
    }

    // ═══════════════════════════════════════════
    //  Actions
    // ═══════════════════════════════════════════
    async function runNextPhase() {
      if (!currentSession || !currentDelta) return;
      const btn = document.querySelector('#input-area .btn.primary');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Knoten denken nach + Koordination…';

      const humanInput = document.getElementById('human-input').value.trim();

      try {
        const result = await api('POST', '/round/run', {
          session_id: currentSession.id,
          delta_id: currentDelta.id,
          human_input: humanInput,
        });

        // Advance phase
        const phaseResult = await api('POST', '/phase/advance', {
          session_id: currentSession.id,
        });

        currentSession = phaseResult.session;
        updatePhaseUI();

        // Reload session data
        sessionData = await api('GET', '/session?id=' + currentSession.id);
        currentDelta = sessionData.deltas.find(d => d.id === currentDelta.id) || currentDelta;
        if (result.notes) {
          currentDelta.notes = (currentDelta.notes || []);
          // Refresh from server
          const refreshed = sessionData.deltas.find(d => d.id === currentDelta.id);
          if (refreshed) currentDelta = refreshed;
        }

        selectDelta(currentDelta);
        document.getElementById('human-input').value = '';
      } catch (e) {
        console.error(e);
        alert('Fehler: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span id="run-btn-text">Nächste Phase</span>';
        updatePhaseUI();
        selectDelta(currentDelta);
      }
    }

    async function submitResponse() {
      if (!currentDelta || !currentSession) return;
      const input = document.getElementById('human-input').value.trim();
      if (!input) return;

      await api('POST', '/respond', {
        delta_id: currentDelta.id,
        session_id: currentSession.id,
        content: input,
      });

      document.getElementById('human-input').value = '';
      sessionData = await api('GET', '/session?id=' + currentSession.id);
      currentDelta = sessionData.deltas.find(d => d.id === currentDelta.id);
      selectDelta(currentDelta);
    }

    async function deriveDelta() {
      const input = document.getElementById('human-input').value.trim();
      if (!input) {
        showNewDeltaModal();
        return;
      }
      await api('POST', '/delta/create', {
        session_id: currentSession.id,
        content: input,
        parent_delta_id: currentDelta ? currentDelta.id : null,
      });
      document.getElementById('human-input').value = '';
      sessionData = await api('GET', '/session?id=' + currentSession.id);
      renderSpur();
      selectDelta(sessionData.deltas[sessionData.deltas.length - 1]);
    }

    async function createSession() {
      const name = document.getElementById('modal-session-name').value.trim() || 'Neue Session';
      const topic = document.getElementById('modal-session-topic').value.trim();
      if (!topic) { alert('Bitte ein Thema eingeben.'); return; }

      await api('POST', '/session/create', { name, topic });
      closeModal('new-session-modal');
      document.getElementById('modal-session-name').value = '';
      document.getElementById('modal-session-topic').value = '';
      loadSessions();
    }

    async function createDelta() {
      const content = document.getElementById('modal-delta-content').value.trim();
      if (!content) { alert('Bitte ein Delta eingeben.'); return; }

      await api('POST', '/delta/create', {
        session_id: currentSession.id,
        content,
        parent_delta_id: currentDelta ? currentDelta.id : null,
      });

      closeModal('new-delta-modal');
      document.getElementById('modal-delta-content').value = '';
      sessionData = await api('GET', '/session?id=' + currentSession.id);
      renderSpur();
      selectDelta(sessionData.deltas[sessionData.deltas.length - 1]);
    }

    // ═══════════════════════════════════════════
    //  Navigation
    // ═══════════════════════════════════════════
    function showView(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const view = document.getElementById(name + '-view');
      if (view) view.classList.add('active');

      document.querySelectorAll('[data-view]').forEach(b => {
        b.classList.toggle('active', b.dataset.view === name);
      });
    }

    function showDashboard() {
      document.querySelector('[data-view="session"]').style.display = 'none';
      showView('dashboard');
      loadSessions();
    }

    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.view === 'dashboard') showDashboard();
        else if (btn.dataset.view === 'session' && currentSession) openSession(currentSession.id);
      });
    });

    // ═══════════════════════════════════════════
    //  Helpers
    // ═══════════════════════════════════════════
    function esc(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function getParticipantClass(note) {
      if (note.author_name === 'Theta') return 'theta';
      if (note.author_name === 'Kappa') return 'kappa';
      if (note.author_name === 'A₃') return 'a3';
      if (note.author_type === 'human') return 'human';
      return 'system';
    }

    function showModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function showNewDeltaModal() { showModal('new-delta-modal'); }

    // Escape-Key schließt Modals
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
      }
    });

    // Ctrl+Enter sendet
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key === 'Enter') {
        const input = document.getElementById('human-input');
        if (document.activeElement === input && input.value.trim()) {
          runNextPhase();
        }
      }
    });

    // ═══════════════════════════════════════════
    //  Start
    // ═══════════════════════════════════════════
    window.onerror = function(msg, url, line, col, error) {
      document.body.innerHTML += '<pre style="color:red;padding:20px;background:#1a1a1a;position:fixed;bottom:0;left:0;right:0;z-index:9999;max-height:40vh;overflow:auto">JS ERROR: ' + msg + '\nLine: ' + line + '\n' + (error ? error.stack : '') + '</pre>';
    };
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML += '<pre style="color:red;padding:20px;background:#1a1a1a;position:fixed;bottom:0;left:0;right:0;z-index:9999;max-height:40vh;overflow:auto">PROMISE ERROR: ' + e.reason + '</pre>';
    });
    init();
  </script>
</body>
</html>
