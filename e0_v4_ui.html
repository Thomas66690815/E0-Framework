<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E₀ v4 — Network</title>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: #30363d;
    --text: #c9d1d9;
    --text2: #8b949e;
    --text3: #484f58;
    --accent-a: #58a6ff;
    --accent-b: #7ee787;
    --accent-c: #d2a8ff;
    --accent-d: #f0883e;
    --accent-e: #f778ba;
    --accent-f: #79c0ff;
    --accent-warn: #d29922;
    --accent-red: #f85149;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }

  /* System colors — assigned dynamically, first 6 have presets */
  .sys-color-0 { --sys: var(--accent-a); }
  .sys-color-1 { --sys: var(--accent-b); }
  .sys-color-2 { --sys: var(--accent-c); }
  .sys-color-3 { --sys: var(--accent-d); }
  .sys-color-4 { --sys: var(--accent-e); }
  .sys-color-5 { --sys: var(--accent-f); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    height: 40px;
  }

  header h1 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }

  header .status {
    font-size: 12px;
    color: var(--text2);
    flex: 1;
    text-align: right;
  }

  .btn {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font);
    transition: background 0.15s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--border); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.danger { border-color: var(--accent-red); color: var(--accent-red); }
  .btn.danger:hover { background: rgba(248,81,73,0.15); }
  .btn.primary { border-color: var(--accent-a); color: var(--accent-a); }
  .btn.primary:hover { background: rgba(88,166,255,0.15); }
  .btn.success { border-color: var(--accent-b); color: var(--accent-b); }
  .btn.success:hover { background: rgba(126,231,135,0.15); }

  /* ── Control Bar ── */
  .control-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 0;
    flex-shrink: 0;
    height: 36px;
  }

  .control-bar .tabs {
    display: flex;
    flex: 1;
    overflow-x: auto;
    gap: 0;
    height: 100%;
    align-items: stretch;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    white-space: nowrap;
    position: relative;
    user-select: none;
  }

  .tab:hover {
    color: var(--text);
    background: rgba(255,255,255,0.03);
  }

  .tab.active {
    color: var(--text);
    border-bottom-color: var(--sys, var(--accent-a));
  }

  .tab .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sys, var(--text2));
    flex-shrink: 0;
  }

  .tab .tab-name {
    font-weight: 600;
  }

  .tab .tab-info {
    font-size: 10px;
    color: var(--text2);
    font-weight: 400;
  }

  .tab .tab-close {
    margin-left: 4px;
    font-size: 14px;
    color: var(--text3);
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }

  .tab .tab-close:hover { color: var(--accent-red); }

  .control-bar .actions {
    display: flex;
    gap: 6px;
    padding-left: 8px;
    border-left: 1px solid var(--border);
    margin-left: 4px;
    height: 100%;
    align-items: center;
  }

  /* ── Main Area ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ── System Panel (one per tab) ── */
  .system-panel {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .system-panel.active {
    display: flex;
  }

  .system-info-bar {
    padding: 4px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    color: var(--text2);
    flex-shrink: 0;
  }

  .system-info-bar .metric {
    font-family: var(--mono);
    font-size: 11px;
  }

  .system-info-bar .metric .label {
    color: var(--text3);
  }

  .system-info-bar .metric .value {
    color: var(--text);
  }

  /* ── Transcript ── */
  .transcript {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
  }

  .transcript .entry {
    margin-bottom: 12px;
    padding: 8px 12px;
    border-radius: 6px;
  }

  .transcript .entry.thomas {
    background: rgba(88,166,255,0.06);
    border-left: 2px solid var(--accent-a);
  }

  .transcript .entry.system {
    background: rgba(126,231,135,0.04);
    border-left: 2px solid var(--sys, var(--accent-b));
  }

  .transcript .entry.event {
    background: rgba(139,148,158,0.06);
    border-left: 2px solid var(--text3);
    font-size: 11px;
    color: var(--text2);
  }

  .transcript .entry .role {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
    color: var(--text2);
  }

  .transcript .entry .content {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .transcript .entry .time {
    font-size: 10px;
    color: var(--text3);
    float: right;
  }

  .transcript .entry .metrics-line {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    padding: 3px 0;
    border-top: 1px solid var(--border);
  }

  /* ── Input Area ── */
  .input-area {
    padding: 8px 12px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-area .input-row {
    display: flex;
    gap: 8px;
  }

  .input-area textarea {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: var(--font);
    resize: none;
    min-height: 52px;
    max-height: 150px;
  }

  .input-area textarea:focus {
    outline: none;
    border-color: var(--accent-a);
  }

  .input-area .send-btn {
    align-self: flex-end;
    padding: 8px 20px;
    height: 36px;
  }

  /* ── Loading ── */
  .loading {
    display: none;
    padding: 8px 16px;
    color: var(--accent-warn);
    font-size: 12px;
  }
  .loading.active { display: block; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  .loading.active { animation: pulse 1.5s infinite; }

  /* ── Tab Activity Indicator ── */
  .tab.has-activity .dot {
    animation: activity-pulse 1.5s infinite;
    box-shadow: 0 0 6px var(--sys, var(--accent-warn));
  }

  @keyframes activity-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.5); }
  }

  .tab .activity-badge {
    background: var(--accent-warn);
    color: var(--bg);
    font-size: 9px;
    font-weight: 700;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    margin-left: 2px;
    line-height: 1;
  }

  /* ── DB Explorer Panel ── */
  .db-panel {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .db-panel.active { display: flex; }

  .db-toolbar {
    padding: 8px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }

  .db-toolbar .db-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-right: 8px;
  }

  .db-content {
    flex: 1;
    overflow: auto;
    padding: 12px 16px;
  }

  .db-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .db-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }

  .db-card .card-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    font-family: var(--mono);
  }

  .db-card .card-label {
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
  }

  .db-section {
    margin-bottom: 20px;
  }

  .db-section h3 {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .db-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    font-family: var(--mono);
  }

  .db-table th {
    text-align: left;
    padding: 6px 10px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text2);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    position: sticky;
    top: 0;
  }

  .db-table td {
    padding: 5px 10px;
    border: 1px solid var(--border);
    color: var(--text);
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .db-table tr:hover td {
    background: rgba(255,255,255,0.02);
  }

  .db-query-area {
    padding: 8px 12px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .db-query-area .query-row {
    display: flex;
    gap: 8px;
  }

  .db-query-area textarea {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: var(--mono);
    resize: none;
    min-height: 36px;
  }

  .db-query-area textarea:focus {
    outline: none;
    border-color: var(--accent-c);
  }

  /* ── Inject Button ── */
  .btn-inject {
    background: rgba(240,136,62,0.1);
    color: var(--accent-d);
    border: 1px solid var(--accent-d);
    padding: 2px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    font-family: var(--font);
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn-inject:hover { background: rgba(240,136,62,0.25); }
  .btn-inject:disabled { opacity: 0.3; cursor: default; }

  .inject-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    flex-shrink: 0;
  }

  .inject-bar .inject-target {
    font-size: 11px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .inject-bar .inject-target b {
    color: var(--accent-d);
  }

  .inject-system-select {
    background: var(--panel);
    color: var(--accent-d);
    border: 1px solid var(--accent-d);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    font-family: var(--mono);
    cursor: pointer;
    outline: none;
  }
  .inject-system-select:focus {
    border-color: var(--accent-a);
    box-shadow: 0 0 4px rgba(210,168,255,0.3);
  }

  .inject-preview {
    background: var(--bg);
    border: 1px solid var(--accent-d);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text2);
    max-height: 120px;
    overflow-y: auto;
    margin: 4px 0 8px 0;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ── Query Block (detected in system responses) ── */
  .query-block {
    background: rgba(126,231,135,0.08);
    border: 1px solid var(--accent-b);
    border-radius: 6px;
    padding: 8px 12px;
    margin: 8px 0;
    position: relative;
  }
  .query-block-label {
    font-size: 10px;
    color: var(--accent-b);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .query-block-sql {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 6px;
  }
  .query-block-purpose {
    font-size: 11px;
    color: var(--text3);
    font-style: italic;
    margin-bottom: 6px;
  }
  .query-block-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .query-block-result {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .query-block-result.error { border-color: var(--accent-red); color: var(--accent-red); }
  .query-block-result.success { border-color: var(--accent-b); }

  /* ── Interrupt Button ── */
  .btn-interrupt {
    background: rgba(255,85,85,0.15);
    color: var(--accent-red);
    border: 1px solid var(--accent-red);
    padding: 3px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font);
    display: none;
    animation: pulse-interrupt 1.2s ease-in-out infinite;
  }
  .btn-interrupt.visible { display: inline-block; }
  .btn-interrupt:hover { background: rgba(255,85,85,0.35); }
  @keyframes pulse-interrupt {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    min-width: 360px;
    max-width: 480px;
  }

  .modal h2 {
    font-size: 16px;
    color: var(--text);
    margin-bottom: 16px;
  }

  .modal .field {
    margin-bottom: 12px;
  }

  .modal .field label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 4px;
  }

  .modal .field input, .modal .field select {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: var(--font);
  }

  .modal .field input:focus, .modal .field select:focus {
    outline: none;
    border-color: var(--accent-a);
  }

  .modal .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px;
  }

  /* ── Empty State ── */
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text3);
    font-size: 14px;
  }

  /* ── Search Panel ── */
  .search-panel {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .search-panel.active { display: flex; }

  .search-bar {
    padding: 8px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    flex-shrink: 0;
  }

  .search-bar input, .search-bar select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-family: var(--font);
  }
  .search-bar input:focus, .search-bar select:focus {
    outline: none;
    border-color: var(--accent-a);
  }
  .search-bar input.search-main {
    flex: 1;
    min-width: 200px;
  }
  .search-bar .filter-group {
    display: flex;
    gap: 4px;
    align-items: center;
    font-size: 11px;
    color: var(--text2);
  }
  .search-bar .filter-group input {
    width: 60px;
  }

  .search-results {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
  }

  .search-results .result-count {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .search-results .result-item {
    margin-bottom: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    background: rgba(255,255,255,0.02);
    border-left: 2px solid var(--border);
  }
  .search-results .result-item.role-system {
    border-left-color: var(--accent-b);
  }
  .search-results .result-item.role-thomas {
    border-left-color: var(--accent-a);
  }

  .search-results .result-meta {
    font-size: 10px;
    color: var(--text2);
    margin-bottom: 4px;
    display: flex;
    gap: 12px;
    font-family: var(--mono);
  }
  .search-results .result-meta .sys-name {
    font-weight: 600;
    color: var(--text);
    font-family: var(--font);
    text-transform: capitalize;
  }

  .search-results .result-content {
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 120px;
    overflow: hidden;
    position: relative;
  }
  .search-results .result-content.expanded {
    max-height: none;
  }
  .search-results .result-expand {
    font-size: 11px;
    color: var(--accent-a);
    cursor: pointer;
    margin-top: 4px;
  }
  .search-results .result-expand:hover { text-decoration: underline; }

  .search-stats {
    padding: 10px 12px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
    flex-shrink: 0;
  }

  /* ── Responsive ── */
  @media (max-width: 800px) {
    .control-bar .actions .btn-label { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>E₀ v4</h1>
  <span class="status" id="headerStatus"></span>
  <button class="btn-interrupt" id="interruptBtn" onclick="interruptProcessing()">⛔ Interrupt</button>
  <button class="btn" onclick="saveSession()">Save</button>
  <button class="btn" onclick="downloadTranscripts()">Export</button>
  <button class="btn danger" onclick="stopAll()">Stop</button>
</header>

<!-- Control Bar: Tabs + Actions -->
<div class="control-bar">
  <div class="tabs" id="tabBar"></div>
  <div class="actions">
    <button class="btn" onclick="toggleSearch()" title="Suche in der Datenbank">🔍 Suche</button>
    <button class="btn" onclick="toggleDbPanel()" title="DuckDB Explorer" style="border-color:var(--accent-c);color:var(--accent-c);">📊 Daten</button>
    <button class="btn primary" onclick="showAddSystemModal()">+ Neuer Partner</button>
    <button class="btn" onclick="showRegistryModal()">Registry</button>
  </div>
</div>

<!-- Main: System Panels (tab content) -->
<div class="main" id="mainArea">
  <div class="empty-state" id="emptyState">
    Kein System aktiv. Erstelle einen neuen Partner oder lade einen bestehenden.
  </div>

  <!-- Search Panel (Phase 3) -->
  <div class="search-panel" id="searchPanel">
    <div class="search-bar">
      <input type="text" class="search-main" id="searchQuery" placeholder="Suchbegriff (z.B. Polyzentrum, Widerstand, Historisierung...)"
             onkeydown="if(event.key==='Enter')runSearch()">
      <select id="searchSystem">
        <option value="">Alle Systeme</option>
      </select>
      <select id="searchRole">
        <option value="">Alle Rollen</option>
        <option value="system">System</option>
        <option value="thomas">Thomas</option>
      </select>
      <div class="filter-group">
        <span>h≥</span>
        <input type="number" id="searchMinH" step="0.1" placeholder="—">
        <span>R≤</span>
        <input type="number" id="searchMaxR" step="1" placeholder="—">
      </div>
      <button class="btn primary" onclick="runSearch()">Suchen</button>
    </div>
    <div class="search-results" id="searchResults">
      <div style="color:var(--text3);padding:40px;text-align:center;">
        Durchsuche den gesamten E₀-Dialog.<br>
        <span style="font-size:12px;">125 Einträge · 3 Systeme · 33 Topologien</span>
      </div>
    </div>
    <div class="search-stats" id="searchStats"></div>
  </div>

  <!-- Database Explorer Panel -->
  <div class="db-panel" id="dbPanel">
    <div class="db-toolbar">
      <span class="db-title">📊 DuckDB Explorer</span>
      <select id="dbTableSelect" onchange="loadTableData()" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-family:var(--font);">
        <option value="">Tabelle wählen...</option>
      </select>
      <button class="btn" onclick="loadDbOverview()">Übersicht</button>
    </div>
    <div class="db-content" id="dbContent">
      <div style="color:var(--text3);padding:40px;text-align:center;">
        DuckDB Explorer — Durchsuche und analysiere E₀-Daten
      </div>
    </div>
    <div class="db-query-area">
      <div class="query-row">
        <textarea id="dbQueryInput" placeholder="SQL Query (z.B. SELECT * FROM interactions LIMIT 10)  —  Ctrl+Enter zum Ausführen" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){runDbQuery();event.preventDefault();}"></textarea>
        <button class="btn" style="border-color:var(--accent-c);color:var(--accent-c);" onclick="runDbQuery()">▶ SQL</button>
      </div>
      <div class="inject-bar" id="dbInjectBar">
        <span class="inject-target" id="dbInjectTarget">
          Ziel: <select id="dbInjectSystemSelect" class="inject-system-select" onchange="updateInjectBar()"></select>
          <span id="dbInjectInfo" style="color:var(--text3);font-size:11px;"></span>
        </span>
        <button class="btn-inject" id="dbInjectBtn" onclick="injectDbResults()" disabled>→ Ergebnis injizieren</button>
        <button class="btn-inject" onclick="injectDbResultsDirect()" id="dbInjectDirectBtn" disabled style="border-color:var(--accent-b);color:var(--accent-b);background:rgba(126,231,135,0.1);">⚡ Direkt senden</button>
      </div>
    </div>
  </div>
</div>

<!-- Add System Modal -->
<div class="modal-overlay" id="addSystemModal">
  <div class="modal">
    <h2>Neuer Partner</h2>
    <div class="field">
      <label>Name (leer = nächster griechischer Buchstabe)</label>
      <input type="text" id="newSysName" placeholder="z.B. delta">
    </div>
    <div class="field">
      <label>Modell</label>
      <input type="text" id="newSysModel" placeholder="gpt-4.1">
    </div>
    <div class="field">
      <label>Base URL (leer = Standard)</label>
      <input type="text" id="newSysUrl" placeholder="">
    </div>
    <div class="actions">
      <button class="btn" onclick="closeModal('addSystemModal')">Abbrechen</button>
      <button class="btn primary" onclick="addSystem()">Erstellen</button>
    </div>
  </div>
</div>

<!-- Registry Modal -->
<div class="modal-overlay" id="registryModal">
  <div class="modal" style="min-width:500px;">
    <h2>System Registry</h2>
    <div id="registryList" style="max-height:400px;overflow-y:auto;"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal('registryModal')">Schließen</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════
//  E₀ v4 UI — Dynamic Tab System
// ══════════════════════════════════════

// State
let systems = {};      // { id: { descriptor, transcript: [] } }
let activeTab = null;  // current system_id
let colorIndex = 0;

// ── Colors ──
const COLORS = ['--accent-a','--accent-b','--accent-c','--accent-d','--accent-e','--accent-f'];
function assignColor(systemId) {
  if (!systems[systemId]) return 0;
  return systems[systemId].colorIdx || 0;
}

// ── Init ──
async function init() {
  try {
    // Load registry status to discover systems
    const resp = await fetch('/registry');
    const registry = await resp.json();

    // Create local state for each system
    registry.systems.forEach((desc, i) => {
      systems[desc.system_id] = {
        descriptor: desc,
        transcript: [],
        colorIdx: i % COLORS.length,
        unseenCount: 0,
      };
    });

    renderTabs();
    updateInjectSystemSelect();

    // Activate first active system
    const firstActive = registry.systems.find(s => s.status === 'active');
    if (firstActive) {
      switchTab(firstActive.system_id);
    }

    // Load existing transcripts for active systems
    for (const desc of registry.systems) {
      if (desc.status === 'active') {
        await loadTranscript(desc.system_id);
      }
    }
  } catch (e) {
    console.error('Init failed:', e);
    document.getElementById('headerStatus').textContent = 'Connection failed';
  }
  startPolling();
}

// ── Tab Rendering ──
function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';

  const sortedIds = Object.keys(systems).filter(id =>
    systems[id].descriptor.status === 'active'
  );

  if (sortedIds.length === 0) {
    document.getElementById('emptyState').style.display = 'flex';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';

  sortedIds.forEach(id => {
    const sys = systems[id];
    const desc = sys.descriptor;
    const tab = document.createElement('div');
    const unseen = sys.unseenCount || 0;
    tab.className = `tab sys-color-${sys.colorIdx}` + (unseen > 0 ? ' has-activity' : '') + (id === activeTab ? ' active' : '');
    tab.dataset.system = id;

    const turns = desc.turn_count || 0;
    const lastH = desc.last_metrics ? `h=${desc.last_metrics.h}` : '';
    const info = turns > 0 ? `${turns}t ${lastH}` : 'new';
    const badge = unseen > 0 ? `<span class="activity-badge">${unseen}</span>` : '';

    tab.innerHTML = `
      <span class="dot"></span>
      <span class="tab-name">${esc(desc.display_name || capitalize(id))}</span>
      <span class="tab-info">${info}</span>
      ${badge}
      <span class="tab-close" onclick="event.stopPropagation(); parkSystem('${id}')" title="Park">×</span>
    `;
    tab.onclick = () => switchTab(id);
    bar.appendChild(tab);
  });

  ensurePanelsExist(sortedIds);
}

function ensurePanelsExist(ids) {
  const main = document.getElementById('mainArea');

  ids.forEach(id => {
    if (document.getElementById('panel-' + id)) return;

    const sys = systems[id];
    const panel = document.createElement('div');
    panel.className = 'system-panel';
    panel.id = 'panel-' + id;
    panel.dataset.system = id;
    panel.innerHTML = `
      <div class="system-info-bar sys-color-${sys.colorIdx}">
        <span><b>${esc(sys.descriptor.display_name || capitalize(id))}</b></span>
        <span class="metric"><span class="label">Model: </span><span class="value">${esc(sys.descriptor.model)}</span></span>
        <span class="metric" id="metrics-${id}"></span>
        <span style="flex:1"></span>
        <span class="metric"><span class="label">Turns: </span><span class="value" id="turns-${id}">${sys.descriptor.turn_count || 0}</span></span>
      </div>
      <div class="transcript" id="transcript-${id}"></div>
      <div class="loading" id="loading-${id}">Verarbeite...</div>
      <div class="input-area">
        <div class="input-row">
          <textarea id="input-${id}" placeholder="Nachricht an ${capitalize(id)}..." onkeydown="handleKey(event, '${id}')"></textarea>
          <button class="btn primary send-btn" onclick="sendPrompt('${id}')">Senden</button>
        </div>
      </div>
    `;
    main.appendChild(panel);
  });
}

function switchTab(id) {
  activeTab = id;
  if (systems[id]) { systems[id].unseenCount = 0; }
  searchActive = false;
  dbPanelActive = false;
  document.getElementById('searchPanel').classList.remove('active');
  document.getElementById('dbPanel').classList.remove('active');

  // Re-render tabs (clears activity badge)
  renderTabs();

  // Show/hide panels
  document.querySelectorAll('.system-panel').forEach(p => {
    p.classList.toggle('active', p.dataset.system === id);
  });

  document.getElementById('emptyState').style.display = 'none';

  // Focus the input
  const input = document.getElementById('input-' + id);
  if (input) setTimeout(() => input.focus(), 50);
}

// ── Load existing transcript ──
async function loadTranscript(systemId) {
  try {
    const resp = await fetch('/transcript/' + systemId);
    const data = await resp.json();
    if (data.entries && data.entries.length > 0) {
      data.entries.forEach(e => {
        addEntry(systemId, e.role, e.content, false);
      });
    }
  } catch (e) {
    // No transcript yet — that's fine
  }
}

// ── Send ──
async function sendPrompt(systemId) {
  const input = document.getElementById('input-' + systemId);
  const prompt = input.value.trim();
  if (!prompt) return;

  input.value = '';
  addEntry(systemId, 'thomas', prompt);
  setLoading(systemId, true);

  try {
    const resp = await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: systemId, prompt }),
    });
    const data = await resp.json();
    if (data.error) {
      addEntry(systemId, 'event', 'Fehler: ' + data.error);
    } else {
      addEntry(systemId, 'system', data.response, true, data.metrics);
    }
  } catch (e) {
    addEntry(systemId, 'event', 'Netzwerkfehler: ' + e.message);
  }

  setLoading(systemId, false);
  autoSave();
}

function handleKey(e, systemId) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    sendPrompt(systemId);
    e.preventDefault();
  }
}

// ── System Management ──
function showAddSystemModal() {
  document.getElementById('newSysName').value = '';
  document.getElementById('newSysModel').value = '';
  document.getElementById('newSysUrl').value = '';
  document.getElementById('addSystemModal').classList.add('active');
}

async function addSystem() {
  const name = document.getElementById('newSysName').value.trim() || undefined;
  const model = document.getElementById('newSysModel').value.trim() || undefined;
  const base_url = document.getElementById('newSysUrl').value.trim() || undefined;

  closeModal('addSystemModal');

  try {
    const resp = await fetch('/add-system', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system_id: name, model, base_url }),
    });
    const desc = await resp.json();
    if (desc.error) {
      alert('Fehler: ' + desc.error);
      return;
    }

    // Add to local state
    const idx = Object.keys(systems).length % COLORS.length;
    systems[desc.system_id] = {
      descriptor: desc,
      transcript: [],
      colorIdx: idx,
      unseenCount: 0,
    };

    renderTabs();
    updateInjectSystemSelect();
    switchTab(desc.system_id);
  } catch (e) {
    alert('Fehler: ' + e.message);
  }
}

async function parkSystem(systemId) {
  try {
    const resp = await fetch('/park-system', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system_id: systemId }),
    });
    const desc = await resp.json();
    if (desc.error) {
      alert('Fehler: ' + desc.error);
      return;
    }

    // Update local state
    systems[systemId].descriptor.status = 'parked';

    // Remove panel
    const panel = document.getElementById('panel-' + systemId);
    if (panel) panel.remove();

    // Switch to another tab if this was active
    if (activeTab === systemId) {
      const remaining = Object.keys(systems).filter(id =>
        systems[id].descriptor.status === 'active'
      );
      activeTab = remaining.length > 0 ? remaining[0] : null;
    }

    renderTabs();
    updateInjectSystemSelect();
    if (activeTab) switchTab(activeTab);
  } catch (e) {
    alert('Fehler: ' + e.message);
  }
}

async function restoreSystem(systemId) {
  try {
    const resp = await fetch('/restore-system', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system_id: systemId }),
    });
    const desc = await resp.json();
    if (desc.error) {
      alert('Fehler: ' + desc.error);
      return;
    }

    systems[systemId].descriptor = desc;
    renderTabs();
    switchTab(systemId);
    await loadTranscript(systemId);
  } catch (e) {
    alert('Fehler: ' + e.message);
  }
  closeModal('registryModal');
}

// ── Registry Modal ──
async function showRegistryModal() {
  const modal = document.getElementById('registryModal');
  const list = document.getElementById('registryList');
  list.innerHTML = '<div style="color:var(--text2);font-size:12px;">Lade...</div>';
  modal.classList.add('active');

  try {
    const resp = await fetch('/registry');
    const data = await resp.json();

    if (data.systems.length === 0) {
      list.innerHTML = '<div style="color:var(--text2);font-size:12px;">Keine Systeme registriert.</div>';
      return;
    }

    list.innerHTML = data.systems.map(s => {
      const isActive = s.status === 'active';
      const isParked = s.status === 'parked';
      const statusColor = isActive ? 'var(--accent-b)' : isParked ? 'var(--accent-warn)' : 'var(--text3)';
      const actions = isParked
        ? `<button class="btn success" style="font-size:11px;padding:2px 8px;" onclick="restoreSystem('${s.system_id}')">Laden</button>`
        : isActive
          ? `<button class="btn" style="font-size:11px;padding:2px 8px;" onclick="parkSystem('${s.system_id}'); closeModal('registryModal');">Parken</button>`
          : '';

      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
        <span style="width:8px;height:8px;border-radius:50%;background:${statusColor};flex-shrink:0;"></span>
        <span style="font-weight:600;min-width:80px;">${esc(s.display_name || capitalize(s.system_id))}</span>
        <span style="font-size:11px;color:var(--text2);">${esc(s.model)}</span>
        <span style="font-size:11px;color:var(--text2);">${s.turn_count || 0} turns</span>
        <span style="font-size:10px;color:${statusColor};text-transform:uppercase;letter-spacing:0.5px;">${s.status}</span>
        <span style="flex:1"></span>
        ${actions}
      </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = `<div style="color:var(--accent-red);font-size:12px;">Fehler: ${e.message}</div>`;
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// ── Transcript Rendering ──
function addEntry(systemId, role, content, scroll = true, metrics = null) {
  const container = document.getElementById('transcript-' + systemId);
  if (!container) return;

  const entry = document.createElement('div');
  entry.className = 'entry ' + role;

  const time = new Date().toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const roleName = role === 'thomas' ? 'Thomas'
    : role === 'system' ? capitalize(systemId)
    : 'Event';

  let metricsHtml = '';
  if (metrics && role === 'system') {
    metricsHtml = `<div class="metrics-line">R=${metrics.r}  h=${metrics.h}  φ=${metrics.phi}  v=${metrics.v}  τ=${metrics.tau}</div>`;
    // Update info bar
    updateMetricsDisplay(systemId, metrics);
  }

  // Parse query blocks from system response
  const contentHtml = (role === 'system') ? renderWithQueryBlocks(systemId, content) : esc(content);

  entry.innerHTML = `
    <span class="time">${time}</span>
    <div class="role">${roleName}</div>
    <div class="content">${contentHtml}</div>
    ${metricsHtml}
  `;

  container.appendChild(entry);
  if (scroll) container.scrollTop = container.scrollHeight;

  if (systems[systemId]) {
    systems[systemId].transcript.push({ role, content, time });
    // Track unseen activity for non-active tabs
    if (systemId !== activeTab && (role === 'system' || role === 'assistant')) {
      systems[systemId].unseenCount = (systems[systemId].unseenCount || 0) + 1;
      renderTabs();
    }
  }
}

function updateMetricsDisplay(systemId, metrics) {
  const el = document.getElementById('metrics-' + systemId);
  if (el && metrics) {
    el.innerHTML = `<span class="label">R=</span><span class="value">${metrics.r}</span>` +
      ` <span class="label">h=</span><span class="value">${metrics.h}</span>` +
      ` <span class="label">φ=</span><span class="value">${metrics.phi}</span>`;
  }
  const turns = document.getElementById('turns-' + systemId);
  if (turns && systems[systemId]) {
    const count = systems[systemId].transcript.filter(e => e.role === 'system').length;
    const desc = systems[systemId].descriptor;
    turns.textContent = (desc.turn_count || 0) + count;
  }
}

function setLoading(systemId, active) {
  const el = document.getElementById('loading-' + systemId);
  if (el) el.className = active ? 'loading active' : 'loading';
}

// ── Session ──
let autoSaveTimer = null;
let autoSaveCounter = 0;

function autoSave() {
  // Debounce: wait 3 seconds after last interaction, then save
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(async () => {
    try {
      await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      autoSaveCounter++;
      document.getElementById('headerStatus').textContent = `Auto-Save #${autoSaveCounter}`;
      setTimeout(() => {
        if (document.getElementById('headerStatus').textContent.startsWith('Auto-Save'))
          document.getElementById('headerStatus').textContent = '';
      }, 2000);
    } catch (e) {
      console.warn('Auto-save failed:', e);
    }
  }, 3000);
}

async function saveSession() {
  try {
    const resp = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const data = await resp.json();
    document.getElementById('headerStatus').textContent = 'Gespeichert';
    setTimeout(() => { document.getElementById('headerStatus').textContent = ''; }, 3000);
  } catch (e) {
    alert('Speichern fehlgeschlagen: ' + e.message);
  }
}

async function downloadTranscripts() {
  try {
    const resp = await fetch('/transcripts');
    const data = await resp.json();
    const blob = new Blob([data.markdown], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `e0_v4_transcript_${new Date().toISOString().slice(0,10)}.md`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Export fehlgeschlagen: ' + e.message);
  }
}

async function stopAll() {
  if (!confirm('Alle Systeme stoppen und Session speichern?')) return;
  try {
    const resp = await fetch('/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const data = await resp.json();
    document.getElementById('headerStatus').textContent = 'GESTOPPT';
  } catch (e) {
    alert('Stop fehlgeschlagen: ' + e.message);
  }
}

// ── Polling ──
async function refreshRegistry() {
  try {
    const resp = await fetch('/registry');
    const data = await resp.json();
    data.systems.forEach(desc => {
      if (systems[desc.system_id]) {
        systems[desc.system_id].descriptor = desc;
      }
    });
    // Update turn counts and metrics in info bars
    Object.keys(systems).forEach(id => {
      const desc = systems[id].descriptor;
      const turns = document.getElementById('turns-' + id);
      if (turns) turns.textContent = desc.turn_count || 0;
      if (desc.last_metrics) updateMetricsDisplay(id, desc.last_metrics);
    });
  } catch (e) {}
}

function startPolling() {
  setInterval(refreshRegistry, 5000);
}

// ── Utilities ──
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function esc(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// ═══════════════════════════════════════
//  Search — Phase 3 DuckDB Integration
// ═══════════════════════════════════════

let searchActive = false;

function toggleSearch() {
  searchActive = !searchActive;
  const panel = document.getElementById('searchPanel');

  if (searchActive) {
    // Hide all system panels, show search
    dbPanelActive = false;
    document.getElementById('dbPanel').classList.remove('active');
    document.querySelectorAll('.system-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    panel.classList.add('active');
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('searchQuery').focus();
    populateSearchSystems();
    loadDbStats();
  } else {
    panel.classList.remove('active');
    // Restore active tab
    if (activeTab) switchTab(activeTab);
    else if (Object.keys(systems).length === 0) {
      document.getElementById('emptyState').style.display = 'flex';
    }
  }
}

function populateSearchSystems() {
  const sel = document.getElementById('searchSystem');
  const current = sel.value;
  sel.innerHTML = '<option value="">Alle Systeme</option>';
  Object.keys(systems).forEach(id => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = capitalize(id);
    sel.appendChild(opt);
  });
  sel.value = current;
}

async function loadDbStats() {
  try {
    const resp = await fetch('/db-stats');
    const stats = await resp.json();
    const bar = document.getElementById('searchStats');
    const bySystem = (stats.by_system || []).map(s =>
      `${s.system_id}: ${s.total_messages} msgs, avg_h=${s.avg_h || '—'}`
    ).join('  ·  ');
    bar.textContent = `DB: ${stats.total_interactions} Interaktionen · ${stats.total_systems} Systeme · ${stats.total_topologies} Topologien  |  ${bySystem}`;
  } catch (e) {
    document.getElementById('searchStats').textContent = 'DB nicht verfügbar';
  }
}

async function runSearch() {
  const q = document.getElementById('searchQuery').value.trim();
  const system = document.getElementById('searchSystem').value;
  const role = document.getElementById('searchRole').value;
  const minH = document.getElementById('searchMinH').value;
  const maxR = document.getElementById('searchMaxR').value;

  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (system) params.set('system', system);
  if (role) params.set('role', role);
  if (minH) params.set('min_h', minH);
  if (maxR) params.set('max_r', maxR);
  params.set('limit', '50');

  const container = document.getElementById('searchResults');
  container.innerHTML = '<div style="color:var(--text2);padding:20px;">Suche...</div>';

  try {
    const resp = await fetch('/db-search?' + params.toString());
    const data = await resp.json();
    renderSearchResults(data, q);
  } catch (e) {
    container.innerHTML = `<div style="color:var(--accent-red);padding:20px;">Fehler: ${e.message}</div>`;
  }
}

function renderSearchResults(data, query) {
  const container = document.getElementById('searchResults');
  lastSearchResults = data; // store for injection

  if (data.count === 0) {
    container.innerHTML = `<div class="result-count">Keine Ergebnisse für "${esc(query || '(alle)')}"</div>`;
    return;
  }

  const searchInjectTarget = getInjectTarget();
  let html = `<div class="result-count">${data.count} Ergebnis${data.count !== 1 ? 'se' : ''} für "${esc(query || '(alle)')}"
    ${searchInjectTarget ? `<button class="btn-inject" onclick="injectSearchResults()" style="margin-left:12px;">→ Alle an ${capitalize(searchInjectTarget)} injizieren</button>` : ''}
  </div>`;

  data.results.forEach((r, i) => {
    const roleClass = r.role === 'system' ? 'role-system' : r.role === 'thomas' ? 'role-thomas' : '';
    const ts = r.ts ? r.ts.substring(0, 19) : '?';
    const hStr = r.h != null ? `h=${r.h.toFixed(4)}` : 'h=—';
    const rStr = r.r != null ? `R=${r.r.toFixed(2)}` : 'R=—';
    const vStr = r.v != null ? `v=${r.v.toFixed(4)}` : '';
    const tauStr = r.tau != null ? `τ=${r.tau}` : '';
    const content = r.content || '';

    // Highlight query in content
    let displayContent = esc(content);
    if (query) {
      const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      displayContent = displayContent.replace(re, '<mark style="background:rgba(210,168,255,0.3);color:var(--text);">$1</mark>');
    }

    html += `
      <div class="result-item ${roleClass}">
        <div class="result-meta">
          <span class="sys-name">${esc(r.system_id)}</span>
          <span>${esc(r.role)}</span>
          <span>${ts}</span>
          <span>${hStr}</span>
          <span>${rStr}</span>
          ${vStr ? `<span>${vStr}</span>` : ''}
          ${tauStr ? `<span>${tauStr}</span>` : ''}
        </div>
        <div class="result-content" id="rc-${i}">${displayContent}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="result-expand" onclick="toggleExpand(${i})">mehr anzeigen</div>
          ${searchInjectTarget ? `<button class="btn-inject" onclick="injectSingleResult(${i})" style="font-size:10px;padding:1px 6px;">→ ${capitalize(searchInjectTarget)}</button>` : ''}
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

function toggleExpand(i) {
  const el = document.getElementById('rc-' + i);
  if (el) {
    const expanded = el.classList.toggle('expanded');
    el.nextElementSibling.textContent = expanded ? 'weniger' : 'mehr anzeigen';
  }
}

// ═══════════════════════════════════════
//  DuckDB Explorer Panel
// ═══════════════════════════════════════

let dbPanelActive = false;

function toggleDbPanel() {
  dbPanelActive = !dbPanelActive;
  const panel = document.getElementById('dbPanel');

  if (dbPanelActive) {
    searchActive = false;
    document.getElementById('searchPanel').classList.remove('active');
    document.querySelectorAll('.system-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    panel.classList.add('active');
    document.getElementById('emptyState').style.display = 'none';
    loadDbOverview();
    loadTableList();
    updateInjectBar();
  } else {
    panel.classList.remove('active');
    if (activeTab) switchTab(activeTab);
    else if (Object.keys(systems).length === 0) {
      document.getElementById('emptyState').style.display = 'flex';
    }
  }
}

async function loadTableList() {
  try {
    const resp = await fetch('/db-tables');
    const data = await resp.json();
    const sel = document.getElementById('dbTableSelect');
    sel.innerHTML = '<option value="">Tabelle wählen...</option>';
    (data.tables || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.name;
      opt.textContent = `${t.name} (${t.row_count} Zeilen, ${t.columns.length} Spalten)`;
      sel.appendChild(opt);
    });
  } catch(e) { console.error('loadTableList:', e); }
}

async function loadDbOverview() {
  const content = document.getElementById('dbContent');
  content.innerHTML = '<div style="color:var(--text2);padding:20px;">Lade Übersicht...</div>';

  try {
    const [statsResp, tablesResp] = await Promise.all([
      fetch('/db-stats'),
      fetch('/db-tables')
    ]);
    const stats = await statsResp.json();
    const tables = await tablesResp.json();

    let html = '<div class="db-cards">';
    html += `<div class="db-card"><div class="card-value">${stats.total_interactions}</div><div class="card-label">Interaktionen</div></div>`;
    html += `<div class="db-card"><div class="card-value">${stats.total_systems}</div><div class="card-label">Systeme</div></div>`;
    html += `<div class="db-card"><div class="card-value">${stats.total_topologies}</div><div class="card-label">Topologien</div></div>`;

    if (stats.by_system && stats.by_system.length > 0) {
      stats.by_system.forEach(s => {
        html += `<div class="db-card">
          <div class="card-value" style="font-size:16px;">${s.total_messages}</div>
          <div class="card-label">${capitalize(s.system_id)} · h̄=${s.avg_h || '—'} · R̄=${s.avg_r || '—'}</div>
        </div>`;
      });
    }
    html += '</div>';

    // Table structure
    html += '<div class="db-section"><h3>Tabellen</h3>';
    (tables.tables || []).forEach(t => {
      html += `<div style="margin-bottom:12px;">`;
      html += `<div style="font-weight:600;font-size:13px;color:var(--text);margin-bottom:4px;cursor:pointer;" onclick="loadTableData('${t.name}')">${t.name} <span style="color:var(--text2);font-weight:400;">(${t.row_count} Zeilen)</span></div>`;
      html += `<div style="display:flex;flex-wrap:wrap;gap:4px;">`;
      t.columns.forEach(c => {
        html += `<span style="font-size:10px;font-family:var(--mono);background:var(--bg);padding:2px 6px;border-radius:4px;border:1px solid var(--border);color:var(--text2);">${c.name} <span style="color:var(--text3);">${c.type}</span></span>`;
      });
      html += `</div></div>`;
    });
    html += '</div>';

    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = `<div style="color:var(--accent-red);padding:20px;">Fehler: ${e.message}</div>`;
  }
}

async function loadTableData(tableName) {
  if (!tableName) {
    tableName = document.getElementById('dbTableSelect').value;
  }
  if (!tableName) return;

  document.getElementById('dbTableSelect').value = tableName;
  const content = document.getElementById('dbContent');
  content.innerHTML = '<div style="color:var(--text2);padding:20px;">Lade...</div>';

  try {
    const resp = await fetch('/db-query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql: `SELECT * FROM ${tableName} ORDER BY 1 DESC LIMIT 100` })
    });
    const data = await resp.json();
    if (data.error) {
      content.innerHTML = `<div style="color:var(--accent-red);padding:20px;">Fehler: ${esc(data.error)}</div>`;
      return;
    }
    renderDbTable(data, `${tableName} (letzte 100 Zeilen)`);
  } catch(e) {
    content.innerHTML = `<div style="color:var(--accent-red);padding:20px;">Fehler: ${e.message}</div>`;
  }
}

async function runDbQuery() {
  const input = document.getElementById('dbQueryInput');
  const sql = input.value.trim();
  if (!sql) return;

  const content = document.getElementById('dbContent');
  content.innerHTML = '<div style="color:var(--text2);padding:20px;">Ausführen...</div>';

  try {
    const resp = await fetch('/db-query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql })
    });
    const data = await resp.json();
    if (data.error) {
      content.innerHTML = `<div style="color:var(--accent-red);padding:20px;">SQL Fehler: ${esc(data.error)}</div>`;
      return;
    }
    renderDbTable(data, sql.substring(0, 80) + (sql.length > 80 ? '...' : ''));
  } catch(e) {
    content.innerHTML = `<div style="color:var(--accent-red);padding:20px;">Fehler: ${e.message}</div>`;
  }
}

function renderDbTable(data, title) {
  const content = document.getElementById('dbContent');
  lastDbResults = data; // store for injection
  updateInjectBar();

  if (!data.columns || !data.rows) {
    content.innerHTML = '<div style="color:var(--text2);padding:20px;">Keine Daten.</div>';
    return;
  }

  let html = `<div style="font-size:12px;color:var(--text2);margin-bottom:8px;">
    ${esc(title)} — ${data.rows.length} Ergebnis${data.rows.length !== 1 ? 'se' : ''}
    ${data.truncated ? ' (gekürzt)' : ''}
  </div>`;

  html += '<div style="overflow-x:auto;"><table class="db-table"><thead><tr>';
  data.columns.forEach(c => { html += `<th>${esc(c)}</th>`; });
  html += '</tr></thead><tbody>';

  data.rows.forEach(row => {
    html += '<tr>';
    row.forEach(val => {
      const sv = val === null ? '∅' : String(val);
      const display = sv.length > 120 ? sv.substring(0, 117) + '...' : sv;
      html += `<td title="${esc(sv)}">${esc(display)}</td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  content.innerHTML = html;
}

// ═══════════════════════════════════════
//  Data Injection — DuckDB → System
// ═══════════════════════════════════════

let lastDbResults = null;
let lastSearchResults = null;

function getInjectTarget() {
  const sel = document.getElementById('dbInjectSystemSelect');
  return sel && sel.value ? sel.value : activeTab;
}

function updateInjectSystemSelect() {
  const sel = document.getElementById('dbInjectSystemSelect');
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = '';
  const ids = Object.keys(systems);
  if (ids.length === 0) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '(kein System)';
    sel.appendChild(opt);
    return;
  }
  ids.forEach(id => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = capitalize(id);
    sel.appendChild(opt);
  });
  // Restore previous selection or default to activeTab
  if (prev && ids.includes(prev)) sel.value = prev;
  else if (activeTab && ids.includes(activeTab)) sel.value = activeTab;
  else sel.value = ids[0];
}

function updateInjectBar() {
  const btn = document.getElementById('dbInjectBtn');
  const btnDirect = document.getElementById('dbInjectDirectBtn');
  const info = document.getElementById('dbInjectInfo');
  if (!btn) return;

  updateInjectSystemSelect();
  const target = getInjectTarget();
  const hasData = lastDbResults && lastDbResults.rows && lastDbResults.rows.length > 0;
  const hasTarget = !!target;

  // Update info text next to dropdown
  if (hasTarget && hasData && info) {
    info.textContent = `· ${lastDbResults.rows.length} Zeilen`;
  } else if (info) {
    info.textContent = hasData ? '' : '· erst Query ausführen';
  }

  btn.disabled = !(hasTarget && hasData);
  btnDirect.disabled = !(hasTarget && hasData);
}

function formatDbResultsAsText(data, maxRows) {
  if (!data || !data.columns || !data.rows) return '';
  const cols = data.columns;
  const rows = data.rows.slice(0, maxRows || 50);
  // Content column limit: unlimited for ≤5 rows, generous for more
  const hasContentCol = cols.some(c => c.toLowerCase() === 'content');

  let lines = [];
  lines.push('── DuckDB-Daten ──');

  // For small result sets, use detailed format (full content)
  if (rows.length <= 10 && cols.length <= 8) {
    rows.forEach((row, i) => {
      lines.push(`[${i+1}]`);
      row.forEach((val, j) => {
        const sv = val === null ? '∅' : String(val);
        // Full content for ≤5 rows, 2000 chars for 6-10 rows
        const limit = rows.length <= 5 ? 0 : 2000;
        const display = (limit > 0 && sv.length > limit) ? sv.substring(0, limit) + '…' : sv;
        lines.push(`  ${cols[j]}: ${display}`);
      });
      lines.push('');
    });
  } else {
    // Table format for larger sets — content gets 500 chars, others 100
    lines.push(cols.join(' | '));
    lines.push(cols.map(() => '---').join(' | '));
    rows.forEach(row => {
      lines.push(row.map((v, j) => {
        const sv = v === null ? '∅' : String(v);
        const isContent = cols[j].toLowerCase() === 'content';
        const limit = isContent ? 500 : 100;
        return sv.length > limit ? sv.substring(0, limit - 3) + '…' : sv;
      }).join(' | '));
    });
  }

  return lines.join('\n');
}

function formatSearchResultAsText(result) {
  let lines = [];
  const ts = result.ts ? result.ts.substring(0, 19) : '?';
  const h = result.h != null ? `h=${result.h.toFixed(4)}` : '';
  const r = result.r != null ? `R=${result.r.toFixed(2)}` : '';
  lines.push(`── Aus dem Netzwerk-Archiv ──`);
  lines.push(`System: ${result.system_id} · Rolle: ${result.role} · ${ts}`);
  if (h || r) lines.push(`Metriken: ${[h, r].filter(Boolean).join('  ')}`);
  lines.push('');
  lines.push(result.content || '');
  return lines.join('\n');
}

function formatAllSearchResultsAsText(data) {
  if (!data || !data.results || data.results.length === 0) return '';
  let lines = [`── ${data.count} Einträge aus dem Netzwerk-Archiv ──`, ''];
  data.results.forEach((r, i) => {
    const ts = r.ts ? r.ts.substring(0, 19) : '?';
    const h = r.h != null ? `h=${r.h.toFixed(4)}` : '';
    const rr = r.r != null ? `R=${r.r.toFixed(2)}` : '';
    lines.push(`[${i+1}] ${r.system_id}/${r.role} ${ts} ${[h, rr].filter(Boolean).join(' ')}`);
    // Full content for ≤5 results, 1000 chars for more
    const limit = data.results.length <= 5 ? 0 : 1000;
    const content = (limit > 0 && r.content && r.content.length > limit)
      ? r.content.substring(0, limit) + '…'
      : (r.content || '');
    lines.push(`    ${content}`);
    lines.push('');
  });
  return lines.join('\n');
}

// Inject into textarea (user reviews before sending)
function injectDbResults() {
  const target = getInjectTarget();
  if (!target || !lastDbResults) return;
  const text = formatDbResultsAsText(lastDbResults);
  injectIntoInput(target, text);
}

// Inject and send directly
async function injectDbResultsDirect() {
  const target = getInjectTarget();
  if (!target || !lastDbResults) return;
  const text = formatDbResultsAsText(lastDbResults);

  // Switch to system tab and send
  switchTab(target);
  activeQueryAbort = new AbortController();
  queryProcessingActive = true;
  showInterrupt(true);

  addEntry(target, 'thomas', text);
  setLoading(target, true);

  try {
    const resp = await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: target, prompt: text }),
      signal: activeQueryAbort.signal,
    });
    const data = await resp.json();
    if (data.error) {
      addEntry(target, 'event', 'Fehler: ' + data.error);
    } else {
      addEntry(target, 'system', data.response, true, data.metrics);
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      addEntry(target, 'event', '⛔ Verarbeitung unterbrochen (Interrupt)');
    } else {
      addEntry(target, 'event', 'Netzwerkfehler: ' + e.message);
    }
  }
  setLoading(target, false);
  queryProcessingActive = false;
  showInterrupt(false);
  activeQueryAbort = null;
}

function injectSingleResult(index) {
  const target = getInjectTarget();
  if (!target || !lastSearchResults || !lastSearchResults.results) return;
  const result = lastSearchResults.results[index];
  if (!result) return;
  const text = formatSearchResultAsText(result);
  injectIntoInput(target, text);
  // Flash confirmation
  document.getElementById('headerStatus').textContent = `→ ${capitalize(target)} injiziert`;
  setTimeout(() => document.getElementById('headerStatus').textContent = '', 2000);
}

function injectSearchResults() {
  const target = getInjectTarget();
  if (!target || !lastSearchResults) return;
  const text = formatAllSearchResultsAsText(lastSearchResults);
  injectIntoInput(target, text);
  document.getElementById('headerStatus').textContent = `→ ${lastSearchResults.count} Einträge an ${capitalize(target)}`;
  setTimeout(() => document.getElementById('headerStatus').textContent = '', 2000);
}

function injectIntoInput(systemId, text) {
  // Switch to the system tab
  switchTab(systemId);

  // Put into textarea
  const input = document.getElementById('input-' + systemId);
  if (input) {
    // If there's already text, add separator
    if (input.value.trim()) {
      input.value += '\n\n' + text;
    } else {
      input.value = text;
    }
    input.focus();
    // Scroll textarea to top so user sees the injected data
    input.scrollTop = 0;
    // Auto-expand textarea for visibility
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 300) + 'px';
  }
}

// ═══════════════════════════════════════
//  Query Block Detection & Execution
// ═══════════════════════════════════════

const QUERY_BEGIN = '--BEGIN DUCKDB QUERY--';
const QUERY_END = '--END DUCKDB QUERY--';
let queryBlockCounter = 0;
let activeQueryAbort = null; // AbortController for interrupt
let queryProcessingActive = false;
const queryBlockStore = {}; // blockId → { sql, systemId }

function renderWithQueryBlocks(systemId, content) {
  // Split content around query blocks
  const parts = [];
  let remaining = content;
  let idx;

  while ((idx = remaining.indexOf(QUERY_BEGIN)) !== -1) {
    // Text before the block
    if (idx > 0) parts.push({ type: 'text', value: remaining.substring(0, idx) });

    const endIdx = remaining.indexOf(QUERY_END, idx);
    if (endIdx === -1) {
      // No closing delimiter — treat rest as text
      parts.push({ type: 'text', value: remaining.substring(idx) });
      remaining = '';
      break;
    }

    // Extract SQL between delimiters
    const sqlRaw = remaining.substring(idx + QUERY_BEGIN.length, endIdx).trim();
    const blockId = 'qb-' + (queryBlockCounter++);

    // Look for PURPOSE comment after the closing delimiter
    const afterEnd = remaining.substring(endIdx + QUERY_END.length);
    let purpose = '';
    const purposeMatch = afterEnd.match(/^[\s\n]*(?:```)?[\s\n]*#\s*PURPOSE:\s*(.+?)(?:\n|$)/i);
    if (purposeMatch) {
      purpose = purposeMatch[1].trim();
    }

    parts.push({ type: 'query', sql: sqlRaw, blockId, systemId, purpose });

    remaining = remaining.substring(endIdx + QUERY_END.length);
    // Skip the purpose line if we captured it
    if (purposeMatch) {
      remaining = remaining.substring(remaining.indexOf(purposeMatch[0]) + purposeMatch[0].length);
    }
  }
  if (remaining) parts.push({ type: 'text', value: remaining });

  // Build HTML — store SQL in JS object, reference by blockId (avoids HTML attribute escaping issues)
  return parts.map(p => {
    if (p.type === 'text') return esc(p.value);
    queryBlockStore[p.blockId] = { sql: p.sql, systemId: p.systemId };
    return `
      <div class="query-block" id="${p.blockId}">
        <div class="query-block-label">📊 DuckDB Query</div>
        <div class="query-block-sql">${esc(p.sql)}</div>
        ${p.purpose ? `<div class="query-block-purpose">Purpose: ${esc(p.purpose)}</div>` : ''}
        <div class="query-block-actions">
          <button class="btn-inject" onclick="runQueryBlock('${p.blockId}', false)">▶ Ausführen & Anzeigen</button>
          <button class="btn-inject" onclick="runQueryBlock('${p.blockId}', true)" style="border-color:var(--accent-b);color:var(--accent-b);background:rgba(126,231,135,0.1);">⚡ Ausführen & Zurücksenden</button>
          <button class="btn-inject" onclick="copyQueryFromBlock('${p.blockId}')" style="border-color:var(--accent-a);color:var(--accent-a);">📋 → Textarea</button>
        </div>
        <div id="${p.blockId}-result"></div>
      </div>`;
  }).join('');
}

// Wrapper: lookup SQL from store, call executeQueryBlock
function runQueryBlock(blockId, sendBack) {
  const entry = queryBlockStore[blockId];
  if (!entry) { console.error('Unknown query block:', blockId); return; }
  executeQueryBlock(blockId, entry.systemId, entry.sql, sendBack);
}

// Wrapper: lookup SQL from store, copy to textarea
function copyQueryFromBlock(blockId) {
  const entry = queryBlockStore[blockId];
  if (!entry) { console.error('Unknown query block:', blockId); return; }
  copyQueryToTextarea(entry.systemId, entry.sql);
}

async function executeQueryBlock(blockId, systemId, sql, sendBack) {
  const resultDiv = document.getElementById(blockId + '-result');
  if (!resultDiv) return;

  resultDiv.className = 'query-block-result';
  resultDiv.textContent = 'Lade...';

  try {
    const resp = await fetch('/db-query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql }),
    });
    const data = await resp.json();

    if (data.error) {
      resultDiv.className = 'query-block-result error';
      resultDiv.textContent = 'Fehler: ' + data.error;
      return;
    }

    // Format result
    const formatted = formatDbResultsAsText(data);
    resultDiv.className = 'query-block-result success';
    resultDiv.textContent = `${data.rows.length} Zeilen, ${data.columns.length} Spalten\n\n${formatted}`;

    if (sendBack) {
      // Inject result back into the system conversation
      const injectionText = `── DuckDB-Ergebnis (${data.rows.length} Zeilen) ──\n${formatted}`;
      await sendQueryResultToSystem(systemId, injectionText);
    }
  } catch (e) {
    resultDiv.className = 'query-block-result error';
    resultDiv.textContent = 'Netzwerkfehler: ' + e.message;
  }
}

async function sendQueryResultToSystem(systemId, text) {
  queryProcessingActive = true;
  showInterrupt(true);
  activeQueryAbort = new AbortController();

  addEntry(systemId, 'thomas', text);
  setLoading(systemId, true);

  try {
    const resp = await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: systemId, prompt: text }),
      signal: activeQueryAbort.signal,
    });
    const data = await resp.json();
    if (data.error) {
      addEntry(systemId, 'event', 'Fehler: ' + data.error);
    } else {
      addEntry(systemId, 'system', data.response, true, data.metrics);
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      addEntry(systemId, 'event', '⛔ Query-Verarbeitung unterbrochen (Interrupt)');
    } else {
      addEntry(systemId, 'event', 'Netzwerkfehler: ' + e.message);
    }
  }

  setLoading(systemId, false);
  queryProcessingActive = false;
  showInterrupt(false);
  activeQueryAbort = null;
  autoSave();
}

function copyQueryToTextarea(systemId, sql) {
  // Switch to system tab if needed
  if (activeTab !== systemId) switchTab(systemId);
  const input = document.getElementById('input-' + systemId);
  if (input) {
    input.value = sql;
    input.focus();
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  }
  document.getElementById('headerStatus').textContent = `SQL → ${capitalize(systemId)} Textarea`;
  setTimeout(() => document.getElementById('headerStatus').textContent = '', 2000);
}

function interruptProcessing() {
  if (activeQueryAbort) {
    activeQueryAbort.abort();
    document.getElementById('headerStatus').textContent = '⛔ Unterbrochen';
    setTimeout(() => document.getElementById('headerStatus').textContent = '', 3000);
  }
}

function showInterrupt(visible) {
  const btn = document.getElementById('interruptBtn');
  if (btn) btn.className = visible ? 'btn-interrupt visible' : 'btn-interrupt';
}

// ── Start ──
init();
