name: E₀ Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install numpy pytest fastapi httpx uvicorn websockets
          pip install -e .

      - name: Run test suite
        run: python -m pytest e0_controller/ server/ --tb=short -q

      - name: Verify test count
        if: always()
        run: |
          count=$(python -m pytest e0_controller/ server/ -q --co 2>&1 | tail -1 | grep -oP '^\d+')
          echo "Tests collected: $count"
          if [ -z "$count" ] || [ "$count" -lt 2000 ]; then
            echo "::error::Test count ${count:-0} is below minimum threshold (2000). Possible test discovery failure."
            exit 1
          fi
