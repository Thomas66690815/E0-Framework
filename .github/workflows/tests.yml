name: E₀ Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install numpy

      - name: Run test suite
        run: python -m unittest discover -s e0_controller -p "test_*.py" -v

      - name: Verify test count
        run: |
          count=$(python -m unittest discover -s e0_controller -p "test_*.py" 2>&1 | grep -oP 'Ran \K[0-9]+')
          echo "Tests run: $count"
          if [ "$count" -lt 1000 ]; then
            echo "::error::Test count $count is below minimum threshold (1000). Possible test discovery failure."
            exit 1
          fi
